<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chirag Chhirauliya's portfolio website featuring projects, skills, GitHub activity, and a contact form." />
    <meta property="og:title" content="Chirag Chhirauliya | Portfolio" />
    <meta property="og:description" content="Computer Science Engineering student, developer, and data science learner." />
    <meta property="og:type" content="website" />
    <title>Chirag Chhirauliya | Portfolio</title>
    <style>
      :root { background-color: #0b0d12; color-scheme: dark; }
      :root[data-theme='light'] { background-color: #f5f7fb; color-scheme: light; }
    </style>
    <script>
      (() => {
        let theme = 'dark'
        try {
          const savedTheme = localStorage.getItem('portfolio-theme')
          theme = savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        } catch {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
